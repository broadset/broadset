name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: actionlint (workflow lint)
        uses: raven-actions/actionlint@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch PPTX corpus (29 real-world fixtures pinned by SHA)
        run: npm run pptx:corpus:fetch -w @broadset/formats

      - name: Knip (dead code / unused deps)
        run: npm run lint:dead

      - name: Type coverage (>= 99.95%)
        run: npm run lint:typecoverage

      - name: Full gate (quality:strict + ct + build)
        run: npm run gate:full

  pptx-libreoffice-verify:
    name: PPTX opens cleanly in LibreOffice
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install LibreOffice
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libreoffice

      - name: Verify canonical PPTX converts cleanly
        run: npm run pptx:libreoffice:verify -w @broadset/formats

  pptx-xsd-validate:
    name: PPTX ECMA-376 XSD validation
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate canonical PPTX against ECMA-376 schemas
        run: npm run pptx:xsd:validate -w @broadset/formats
